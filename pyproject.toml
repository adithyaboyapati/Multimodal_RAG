[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "novacore-multimodal-rag"
version = "1.0.0"
description = "Enterprise Multimodal RAG with ColPali/PDF visual parsing, hybrid sparse-dense retrieval, cross-modal reranking, and grounded VLM generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Adithya Boyapati" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "pinecone>=5.0.0",
    "groq>=0.9.0",
    "openai>=1.12.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "pymupdf>=1.24.0",
    "pandas>=2.2.0",
    "tabulate>=0.9.0",
    "pillow>=10.2.0",
    "langsmith>=0.1.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning"
]
